name: Java Maven Nexus Tomcat Deploy

# Migrated from: javanexustomcat/Jenkinsfile
# Original source: https://github.com/ganesh770924/CICDtestrepo (Educational Use)
# Test case: Java Maven with SonarQube, Nexus repository, and Tomcat deployment
#
# Credential mapping (Jenkins credentials() -> GitHub Actions secrets):
#   sonarqube-token -> secrets.SONARQUBE_TOKEN
#   tomcat-user     -> secrets.TOMCAT_USERNAME / secrets.TOMCAT_PASSWORD
#   nexus-user      -> secrets.NEXUS_USERNAME / secrets.NEXUS_PASSWORD
#
# Required repository variables:
#   NEXUS_URL, NEXUS_REPOSITORY, NEXUS_PROTOCOL, NEXUS_VERSION, TOMCAT_URL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXUS_VERSION: ${{ vars.NEXUS_VERSION || 'nexus3' }}
  NEXUS_PROTOCOL: ${{ vars.NEXUS_PROTOCOL || 'http' }}
  NEXUS_URL: ${{ vars.NEXUS_URL || 'localhost:8081' }}
  NEXUS_REPOSITORY: ${{ vars.NEXUS_REPOSITORY || 'java-mvn-CI-repo' }}

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 8
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build
        run: mvn clean package

      - name: Sonar Analysis
        env:
          SONAR_LOGIN: ${{ secrets.SONARQUBE_TOKEN }}
        run: mvn clean verify sonar:sonar "-Dsonar.host.url=http://localhost:9000" "-Dsonar.login=%SONAR_LOGIN%"
        shell: cmd

      - name: Store war to Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        shell: pwsh
        run: |
          [xml]$pom = Get-Content -Path "pom.xml"
          $groupId = $pom.project.groupId
          $artifactId = $pom.project.artifactId
          $version = $pom.project.version
          $packaging = $pom.project.packaging
          if (-not $packaging) { $packaging = "jar" }

          $artifactPath = Get-ChildItem -Path "target" -Filter "*.$packaging" | Select-Object -First 1 -ExpandProperty FullName

          if (-not $artifactPath) {
            Write-Error "*** File not found for packaging: $packaging"
            exit 1
          }

          Write-Host "*** File: $artifactPath, group: $groupId, packaging: $packaging, version $version"

          curl.exe -u "${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}" `
            --upload-file "$artifactPath" `
            "http://${env:NEXUS_URL}/repository/${env:NEXUS_REPOSITORY}/$($groupId -replace '\.', '/')/$artifactId/$version/$artifactId-$version.$packaging"

          curl.exe -u "${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}" `
            --upload-file "pom.xml" `
            "http://${env:NEXUS_URL}/repository/${env:NEXUS_REPOSITORY}/$($groupId -replace '\.', '/')/$artifactId/$version/$artifactId-$version.pom"

      - name: Pull the file off Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        shell: cmd
        run: curl -L -XGET "http://localhost:8081/service/rest/v1/search/assets/download?sort=version&repository=java-mvn-CI-repo&maven.groupId=com.dev3l.hello_world&maven.artifactId=mvn-hello-world&maven.extension=war" --output JavaMaven.war -u %NEXUS_USERNAME%:%NEXUS_PASSWORD%

      - name: Deploy on this Server
        env:
          TOMCAT_USERNAME: ${{ secrets.TOMCAT_USERNAME }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        shell: cmd
        run: curl -u %TOMCAT_USERNAME%:%TOMCAT_PASSWORD% --upload-file "JavaApp.war" "http://localhost:8085/manager/text/deploy?path=/JavaApp&update=true"
